name: Continuous Deployment
run-name: Continuous Deployment for ${{ github.ref_name }}

on:
  push:
    branches:
      - main
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployment
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  integration:
    name: Run Continuous Integration
    uses: ./.github/workflows/integration.yml
    secrets: inherit
    permissions:
      actions: read
      contents: read
      security-events: write

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - integration

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: Build
          path: ./dist

      - name: Upload GitHub Pages Build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
