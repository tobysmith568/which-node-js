name: CI
on:
  push:
    branches:
      - renovate/*
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

defaults:
  run:
    shell: pwsh

jobs:
  lint:
    name: Lint

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bunx eslint ./src --max-warnings 0

      - name: Run Prettier
        run: bunx prettier --check .

  build:
    name: Build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: Build
          path: ./out
          retention-days: 1
          if-no-files-found: error

      - name: Upload GitHub Pages Build
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  test:
    name: Test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        run: bun run test:ci

      - name: Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage

  licence:
    name: Check licences

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check Licenses
        run: bunx license-cop

  e2e:
    needs:
      - build

    strategy:
      fail-fast: false
      matrix:
        browser:
          - name: Chrome
            value: chromium
          - name: Firefox
            value: firefox

    name: E2E test (${{ matrix.browser.name }})

    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser
        run: bunx playwright install --with-deps ${{ matrix.browser.value }}

      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: Build
          path: ./out

      - name: Run E2E tests
        run: bun run e2e --project=${{ matrix.browser.value }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Playwright Report (${{ matrix.browser.name }})
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 1
