name: Continuous Integration
run-name: Continuous Integration for ${{ (github.event.pull_request.number && format('PR {0}', github.event.pull_request.number)) || github.ref_name }}

on:
  push:
    branches:
      - renovate/*
  pull_request:
    branches:
      - main
      - "!renovate/*"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  codeql:
    name: CodeQL
    uses: ./.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run Prettier
        run: bun run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run ESLint
        run: bun run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check types
        run: bun run typecheck

  licenses:
    name: Licenses
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Check licenses
        run: bun run license-check

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Build
        run: bun run build

      - name: Upload Build
        uses: actions/upload-artifact@v7
        with:
          name: Build
          path: ./dist
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - typecheck

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Run Unit Tests
        run: bun run test:ci

      - name: Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: coverage

  e2e:
    name: E2E test (${{ matrix.browser.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - build

    strategy:
      fail-fast: false
      matrix:
        browser:
          - name: Chrome
            value: chromium
          - name: Firefox
            value: firefox

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Install Playwright browser
        run: bunx playwright install --with-deps ${{ matrix.browser.value }}

      - name: Download Build
        uses: actions/download-artifact@v8
        with:
          name: Build
          path: ./dist

      - name: Run E2E tests
        run: bun run e2e --project=${{ matrix.browser.value }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Playwright Report (${{ matrix.browser.name }})
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 1
